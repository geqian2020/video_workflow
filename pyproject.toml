[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "video-workflow"
version = "0.1.0"
description = "Local Chinese slide narration with a cartoon presenter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "slide-stream==2.19.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "pypdfium2>=4.30,<6",
  "edge-tts>=7,<8",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1"]

[project.scripts]
video-workflow = "video_workflow.__main__:main"
video-workflow-extract = "video_workflow.extract:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
